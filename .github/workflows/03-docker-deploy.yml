name: 03-Docker-Deploy

on:
  workflow_run:
    workflows:
      - 02-SonarCloud
    types:
      - completed

permissions:
  contents: read

jobs:
  docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'develop'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare tags
        id: prep
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"

          BRANCH_TAG=$(echo "$BRANCH_NAME" | sed 's#[^a-zA-Z0-9_.-]#-#g')

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/empleados-backend:${{ steps.prep.outputs.branch_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/empleados-backend:${{ steps.prep.outputs.commit_sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/empleados-frontend:${{ steps.prep.outputs.branch_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/empleados-frontend:${{ steps.prep.outputs.commit_sha }}
