apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: empleados-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: empleados-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/empleadosdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: APP_BASIC_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_BASIC_USER
            - name: APP_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_BASIC_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: empleados-staging
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
